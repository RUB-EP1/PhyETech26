name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Export marimo notebook to WebAssembly
        run: uvx marimo export html-wasm apps/gedaempfte_schwingung.py -o dist --mode run --no-show-code --no-sandbox --force
      - name: Replace favicon with official RUB logo
        run: |
          curl -fsSL -o rub-logo.zip https://markenportal.ruhr-uni-bochum.de/wp-content/uploads/2026/10/RUB_Logo.zip
          unzip -p rub-logo.zip "RUB_Logo/Screen RGB/SVG/Ruhr-Universitaet-Bochum_SoMe_Blau_screen_rgb.svg" > dist/favicon.svg
          sed -i 's|<link rel="icon" href="./favicon.ico" />|<link rel="icon" type="image/svg+xml" href="./favicon.svg" />|' dist/index.html
          grep -q 'href="./favicon.svg"' dist/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
